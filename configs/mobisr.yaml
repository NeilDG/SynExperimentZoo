# mobisr.yaml - Consolidated configuration for Mobile SuperRes problem
common:
  input_nc: 3
  patch_size: 64

server_paths:
  0: "C:/Datasets/SuperRes Dataset/"
  1: "/home/npdelgallego/scratch3/Datasets/SuperRes Dataset/"
  2: "X:/SuperRes Dataset/"
  3: "X:/SuperRes Dataset/"
  4: "/home/gamelab/Documents/SuperRes Dataset/"
  5: "C:/Datasets/SuperRes Dataset/"
  6: "C:/Datasets/SuperRes Dataset/"
  7: "D:/Datasets/SuperRes Dataset/"
  8: "/scratch3/neil.delgallego/SuperRes Dataset/"

# Available Model IDs:
# 1: CycleGAN, 2: UNet, 3: AdaIN, 4: FFANet, 5: RRDBNet, 6: SwinIR, 7: AttnResUNet, 8: DenseNet, ...

versions:
  # --- Model 6 (SwinIR) ---
  v02.06_div2k:
    model_type: 6
    num_blocks: 6
    batch_size: [256, 256, 128, 64]
    load_size: [128, 128, 64, 32]
    min_epochs: 400
    max_epochs: 400
    low_path: "{server_path}div2k/lr/*.png"
    high_path: "{server_path}div2k/bicubic_x4/*.png"

  # --- Model 5 (RRDBNet) ---
  v02.05_div2k:
    model_type: 5
    num_blocks: 6
    batch_size: [256, 256, 128, 64]
    load_size: [128, 128, 64, 32]
    min_epochs: 200
    max_epochs: 200
    low_path: "{server_path}div2k/lr/*.png"
    high_path: "{server_path}div2k/bicubic_x4/*.png"

  # --- Model 4 (FFANet) Variants ---
  v02.04_div2k: # Standard variant
    model_type: 4
    num_blocks: 3
    batch_size: [256, 256, 128, 64]
    load_size: [128, 128, 64, 32]
    min_epochs: 400
    max_epochs: 400
    low_path: "{server_path}div2k/lr/*.png"
    high_path: "{server_path}div2k/bicubic_x4/*.png"

  v02.04_hypersim: # Hypersim variant
    model_type: 4
    num_blocks: 3
    batch_size: [256, 256, 128, 64]
    load_size: [128, 128, 64, 32]
    min_epochs: 400
    max_epochs: 400
    low_path: "{server_path}sr-hypersim/classic_x4/*.png"
    high_path: "{server_path}sr-hypersim/high/*.png"

  # --- Model 1 (CycleGAN) Variants ---
  v02.01_div2k:
    model_type: 1
    num_blocks: 6
    batch_size: [1536, 256, 1024, 256]
    load_size: [768, 128, 512, 128]
    min_epochs: 200
    max_epochs: 200
    low_path: "{server_path}div2k/lr/*.png"
    high_path: "{server_path}div2k/bicubic_x4/*.png"

  v02.01_hypersim:
    model_type: 1
    num_blocks: 6
    batch_size: [1536, 256, 1024, 256]
    load_size: [768, 128, 512, 128]
    min_epochs: 200
    max_epochs: 200
    low_path: "{server_path}sr-hypersim/classic_x4/*.png"
    high_path: "{server_path}sr-hypersim/high/*.png"

hyperparams:
  1: {norm_mode: "instance", weights_init: "dc_gan", g_lr: 0.0002, d_lr: 0.0002}
  10: {norm_mode: "batch", weights_init: "zero_one", g_lr: 0.0002, d_lr: 0.0001}
  12: {norm_mode: "batch", weights_init: "zero_one", g_lr: 0.0004, d_lr: 0.0001}

loss_weights:
  1: {l1_weight: 1.0, adv_weight: 1.0}
  2: {l1_weight: 0.01, adv_weight: 1.0}
  3: {l1_weight: 0.0, perceptual_weight: 1.0, adv_weight: 1.0}
