# Available Model IDs:
# 1: CycleGAN Generator, 2: UNet Generator, 3: AdaIN Generator, 4: FFANet, 5: RRDBNet, 6: SwinIR
# 7: AttentionResUNet, 8: DenseNet Generator, 9: NAFSSR, 10: RestormerUNet, 11: PSPNet
# 12: TranslatorGAN, 13: StyleTransferGAN, 14: EmbeddingNetwork, Default: SRMD

versions:
  v62.01_istd: # Model ID 1
    model_type: 1
    num_blocks: 6
    batch_size: [128, 128, 128, 128]
    load_size: [64, 64, 64, 64]
    min_epochs: 200
    max_epochs: 200
    dataset_a_train: "{server_path}istd/train/train_A/*.png"
    dataset_b_train: "{server_path}istd/train/train_B/*.png"

hyperparams:
  1: {norm_mode: "instance", weights_init: "dc_gan", g_lr: 0.0002, d_lr: 0.0002}

loss_weights:
  1: {l1_weight: 1.0, adv_weight: 1.0}
